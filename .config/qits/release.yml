archetype: daemon
artifacts:
  - { type: daemon, name: qits-platform-access-cli, sbom: out/sbom.json }
  # THE PIN, AND IT IS NOT OPTIONAL. One class, three strings, no bytes of the binary: the daemons-
  # store name, the command name, and the version this same release published the binary under.
  # qits-ci's pom depends on it and injects the version it names, which is what stopped every
  # composed release step on the platform from downloading whatever was latest in the daemons store
  # at step start. Dropping it would leave qits-ci pinning a coordinate that stops advancing.
  #
  # SINCE 2026-09-18 THIS ENTRY ALSO KEEPS THE BINARY ABOVE ALIVE, and that is the second reason it
  # is not optional. The two entries are one release stamped twice, and qits-platform-maintenance
  # now reads them that way: `control/CarriedDaemons` resolves a pinned maven coordinate to the
  # repository that released it and serves every DAEMON artifact of that same release as a `daemon`
  # row on `GET /maintenance/api/pins`, which qits-artifacts files as a keep. Before that, nothing
  # named the binary at all — `daemon-binaries` collect at `window=P0D` behind the last two
  # versions, so the version qits-ci's pom still pinned was evicted by the second release after it
  # and every composed release step 404'd on the fetch. The pair below is therefore load-bearing in
  # both directions: the maven entry is how the version is bumped AND how the bytes survive. Ticket
  # d0b1965f-ca40-4780-8ee1-9be56851b465.
  #
  # NO `sbom:` ON THIS ENTRY. The composed postlude submits every declared document from ONE step —
  # the last one that builds — and that is the buildctl step below, whose checkout has no
  # `platform-access-cli-binary/target/` and never will. Declaring the path would make the postlude
  # submit a file that is not there and fail the release, so the maven step submits its own, with
  # the postlude's own command.
  - { type: maven, name: "eu.wohlben.qits:qits-platform-access-cli-binary" }

# THE daemon ARCHETYPE'S OWN HEADER NAMES THIS REPOSITORY AS THE ONE THAT RIDES ITS OWN RECIPES, and
# the reason is the build: there is no `docker/Dockerfile.musl-builder` here, so the archetype's
# guarded toolchain half never fires, and `docker/Dockerfile` takes MUSL_URL and ZLIB_URL directly
# rather than the BUILDER_IMAGE the archetype passes. It would pass an argument this Dockerfile does
# not take from a build arg and omit the two it needs.
release-request:
    # THE CLONE-ALONE GATE FIRST, so a broken test costs no native compile. A ROOT invocation, so it
    # builds the whole reactor: the application and the pin jar. Nothing is deployed from here.
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify

    # Then the shipping form: the static musl binary, on the platform's builder, with no socket.
  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      : "${QITS_MAVEN_REGISTRY_URL:?}"
      maven_root="${QITS_MAVEN_REGISTRY_URL%/}"
      musl_url=$(sed -n 's/^ARG MUSL_URL=//p' docker/Dockerfile)
      zlib_url=$(sed -n 's/^ARG ZLIB_URL=//p' docker/Dockerfile)
      : "${musl_url:?docker/Dockerfile declares no ARG MUSL_URL}"
      : "${zlib_url:?docker/Dockerfile declares no ARG ZLIB_URL}"
      musl_url="$maven_root${musl_url#*/artifacts/maven/maven}"
      zlib_url="$maven_root${zlib_url#*/artifacts/maven/maven}"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=binary \
        --opt build-arg:MUSL_URL="$musl_url" \
        --opt build-arg:ZLIB_URL="$zlib_url" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --output type=local,dest=out
      # THE BINARY IS `out/qits` AND THE ARTIFACT IS `qits-platform-access-cli`. The mismatch is the
      # ordinary case rather than a slip — qits-workspace-oci fetches the artifact by its name and
      # writes it into its build context as `qits` — and this migration touches neither name.
      chmod +x out/qits
      ./out/qits --help >/dev/null
      # A binary that prints Quarkus build-time configuration on --help is unusable as a CLI.
      noise=$(QUARKUS_ANALYTICS_DISABLED=true ./out/qits --help 2>&1) || true
      case "$noise" in
        *ConfigRecorder*|*"Build time property"*)
          echo "$noise" >&2
          echo "the binary prints Quarkus configuration noise under QUARKUS_ANALYTICS_DISABLED" >&2
          exit 1 ;;
      esac
      echo "qits built: $(sha256sum out/qits | cut -d' ' -f1)"

release:
  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      : "${QITS_MAVEN_REGISTRY_URL:?}"
      maven_root="${QITS_MAVEN_REGISTRY_URL%/}"
      musl_url=$(sed -n 's/^ARG MUSL_URL=//p' docker/Dockerfile)
      zlib_url=$(sed -n 's/^ARG ZLIB_URL=//p' docker/Dockerfile)
      : "${musl_url:?docker/Dockerfile declares no ARG MUSL_URL}"
      : "${zlib_url:?docker/Dockerfile declares no ARG ZLIB_URL}"
      musl_url="$maven_root${musl_url#*/artifacts/maven/maven}"
      zlib_url="$maven_root${zlib_url#*/artifacts/maven/maven}"
      # BYTE-IDENTICAL BUILD ARGS ACROSS THE TWO INVOCATIONS, and across the QA build above, or the
      # sbom stage is a second native compile instead of a cache hit on the resolve that produced
      # the binary.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=binary \
        --opt build-arg:MUSL_URL="$musl_url" \
        --opt build-arg:ZLIB_URL="$zlib_url" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --output type=local,dest=out
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:MUSL_URL="$musl_url" \
        --opt build-arg:ZLIB_URL="$zlib_url" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --output type=local,dest=out
      # `chmod +x` IS NOT OPTIONAL: the local export loses the mode bit, and a static binary that
      # cannot be executed is a green build that publishes nothing runnable.
      chmod +x out/qits
      ./out/qits --help >/dev/null
      qits-publish daemon submit \
        --name qits-platform-access-cli --version "$QITS_VERSION" --file out/qits

    # --- the pin jar --------------------------------------------------------------------------
    # A SECOND STEP AND A DIFFERENT IMAGE, because this one needs maven and the one above needs
    # buildctl. It is deliberately AFTER the binary publish: the jar is what tells qits-ci which
    # binary to fetch, so a jar resolvable before its binary is published would be a pin pointing at
    # nothing — briefly, but a release is exactly the moment somebody is watching.
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      # A published version is never republished, and re-running a deploy of the same bytes is a
      # no-op rather than a lie — so this SKIPS where the daemon submit above would refuse.
      #
      # BOTH POMS, and the `&&` is the javalib's "skip only when EVERY module is published" rule: a
      # consumer cannot read the jar's descriptor without the parent, and `-pl` deploys the jar and
      # not the aggregator it names as its parent. Checking one of the two would let a half publish
      # look complete on a re-run.
      if curl -fsS -o /dev/null \
        "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/qits-platform-access-cli-binary/$QITS_VERSION/qits-platform-access-cli-binary-$QITS_VERSION.pom" \
        && curl -fsS -o /dev/null \
          "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/$QITS_VERSION/qits-$QITS_VERSION.pom"; then
        echo "qits-platform-access-cli-binary $QITS_VERSION and its parent are already published — skipping"
        exit 0
      fi
      # NO -Dqits.maven.repository.url: this repository's root pom declares no `qits-maven`
      # <repository> for the settings file to mirror, and the pin module depends on nothing but
      # junit. `-am` IS load-bearing and it is the parent pom — see the probe above.
      # THE PUBLISH CREDENTIAL, AND IT IS AN HTTP HEADER RATHER THAN A USER/PASSWORD. The deployment
      # repository id is `qits` — what -DaltDeploymentRepository names — and no settings file on this
      # estate declares a <server> with that id. Maven does not authenticate preemptively either, so
      # a <username>/<password> pair would never be sent; the credential has to arrive as an
      # Authorization header, which is what the generated -gs settings below carry.
      #
      # MINTED HERE rather than read from the $QITS_PUBLISH_TOKEN qits-ci also injects: that one is
      # minted when the container starts, and the mint's TTL and this step's timeout are the same
      # number (3600s) with a whole build in between.
      #
      # THE HTTP BLOCKER IS RE-DECLARED because `-gs` REPLACES Maven's own conf/settings.xml, and
      # `maven-default-http-blocker` is the only live element in it. Leaving it out would silently
      # drop the blocker for the whole deploy — a loosening nobody asked for.
      #
      # THE FILE HOLDS A BEARER, so: `umask 077`, never `cat`ed, and removed after the deploy. Do
      # not add `-X` to these commands for the same reason — Maven's debug log prints the effective
      # settings, token and all. A minted token is base64url and dots, so nothing in it needs XML
      # escaping.
      #
      # THE PATH IS THIS RECIPE'S OWN, AND THAT IS THE FIX FOR A LIVE FAILURE. qits-ci's container
      # bootstrap (CiDaemonLauncher.BOOTSTRAP) writes /tmp/qits-deploy-settings.xml when the step
      # container starts and APPENDS `-gs /tmp/qits-deploy-settings.xml` to MAVEN_ARGS, which every
      # maven in the step then inherits. This step used to write that very path and then `rm -f` it
      # after the deploy — deleting the platform's file — so the makeBom below started with
      # MAVEN_ARGS still naming a file that was gone and died on:
      #
      #     The specified global settings file does not exist: /tmp/qits-deploy-settings.xml
      #
      # which is what has been blocking this repository's releases since the bearer landed. The
      # collision goes away by writing somewhere the platform does not own.
      #
      # MAVEN_ARGS BEATS THE COMMAND LINE — measured on 3.9.12, and said so in CiDaemonLauncher — so
      # on a current qits-ci this `-gs` is inert and the ambient file is what the deploy uses. It
      # stays anyway: this file is read at main and runs against a tag on whatever qits-ci the
      # estate is deployed with, and on one that injects nothing this is the deploy's only
      # credential.
      #
      # AND IT DEGRADES TO ANONYMOUS — this script is read at main and runs against a tag on whatever
      # qits-ci is deployed, so an absent command or a failed mint leaves the deploy byte-for-byte
      # the one that worked yesterday rather than sending an empty bearer or aborting the step.
      deploy_settings=""
      deploy_token=""
      if [ -n "${QITS_PUBLISH_TOKEN_COMMAND:-}" ] \
        && command -v "$QITS_PUBLISH_TOKEN_COMMAND" >/dev/null 2>&1; then
        deploy_token=$("$QITS_PUBLISH_TOKEN_COMMAND" 2>/dev/null) || deploy_token=""
      fi
      #
      # `printf` AND NOT A HEREDOC, which is a YAML constraint rather than a shell preference: this
      # script is a block scalar, its indentation is set by its first line, and a heredoc body has
      # to sit at the emitted column zero — which is BELOW that indent and silently ends the
      # scalar. Measured: the parser stops at `<settings` and the recipe no longer loads. Quoted
      # printf arguments can be indented with the code around them.
      if [ -n "$deploy_token" ]; then
        ( umask 077
          printf '%s\n' \
            '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">' \
            '  <servers>' \
            '    <server>' \
            '      <id>qits</id>' \
            '      <configuration>' \
            '        <httpHeaders>' \
            '          <property>' \
            '            <name>Authorization</name>' \
            "            <value>Bearer $deploy_token</value>" \
            '          </property>' \
            '        </httpHeaders>' \
            '      </configuration>' \
            '    </server>' \
            '  </servers>' \
            '  <mirrors>' \
            '    <mirror>' \
            '      <id>maven-default-http-blocker</id>' \
            '      <mirrorOf>external:http:*</mirrorOf>' \
            '      <url>http://0.0.0.0/</url>' \
            '      <blocked>true</blocked>' \
            '    </mirror>' \
            '  </mirrors>' \
            '</settings>' > /tmp/qits-recipe-deploy-settings.xml )
        deploy_settings="-gs /tmp/qits-recipe-deploy-settings.xml"
      fi
      QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
      QITS_MAVEN_AUTH_USR="${QITS_COMMISSIONED_CLIENT_ID-}" \
      QITS_MAVEN_AUTH_PSW="${QITS_COMMISSIONED_CLIENT_SECRET-}" \
      ./mvnw -B -ntp -s .qits-maven-settings.xml $deploy_settings -pl platform-access-cli-binary -am deploy -DskipTests \
        -DaltDeploymentRepository="qits::default::$QITS_MAVEN_REGISTRY_URL"
      # The bearer stops existing the moment it stops being needed. Hygiene rather than a
      # guarantee: a failed deploy aborts under the composer's `set -e` and leaves the file, and
      # the step container is destroyed either way. The makeBom that follows publishes nothing.
      #
      # ONLY THIS RECIPE'S OWN FILE. The platform's /tmp/qits-deploy-settings.xml is named by an
      # exported MAVEN_ARGS for the whole step, so removing it here removes the makeBom's own
      # settings file out from under it — see the block above.
      rm -f /tmp/qits-recipe-deploy-settings.xml
      QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
      ./mvnw -B -ntp -s .qits-maven-settings.xml -pl platform-access-cli-binary -DskipTests \
        org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom \
        -DoutputFormat=json -DoutputName=sbom -DschemaVersion=1.6
      qits artifacts publish sbom submit \
        --type maven --name eu.wohlben.qits:qits-platform-access-cli-binary \
        --version "$QITS_VERSION" --file platform-access-cli-binary/target/sbom.json
