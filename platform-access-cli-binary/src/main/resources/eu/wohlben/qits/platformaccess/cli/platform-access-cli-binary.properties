# Filtered at build time — see this module's pom.xml <resources> block and
# PlatformAccessCliBinary's javadoc. The value is the reactor's project version, which the release
# stamps with the version it is about to tag and publish the binary under, so the jar's version,
# the binary's version and the daemons-store coordinate are one string. (Filtering rewrites these
# comment lines too, which is why this one does not spell the property out.)
#
# Do NOT write a literal here. PlatformAccessCliBinary refuses a value that still starts with `$`,
# which is what an unfiltered copy of this file looks like.
version=${project.version}
