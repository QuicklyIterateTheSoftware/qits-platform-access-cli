# The commands write to the terminal themselves. Quarkus' own lines would only get in the way.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.level=WARN

# Fixed here at build time, and the value matters less than the fact that it is written down. This
# property is build time fixed, and the binary's second home is a workspace container whose
# environment sets QUARKUS_ANALYTICS_DISABLED=true for the Maven builds the agent runs around it.
# A build time fixed property that disagrees with its environment makes Quarkus print a
# ConfigRecorder WARN **on stdout**, in front of every answer — and a CLI whose output is read by
# `head`, `jq` or another program cannot afford a line it did not write. Recording the same value
# here means the container's environment agrees with the binary and nothing is printed. The
# analytics prompt itself is meaningless for this binary anyway: it asks at build time, and this
# build is a native compile in CI with nobody to ask.
quarkus.analytics.disabled=true

# The binary is `target/qits`, not `target/qits-platform-access-cli-<version>-runner`. It owns the
# name `qits`; qits-bootstrap-cli's binary is `qits-bootstrap`.
quarkus.package.output-name=qits
quarkus.package.jar.add-runner-suffix=false
