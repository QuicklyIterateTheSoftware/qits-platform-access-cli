# --- the server ---------------------------------------------------------------------------------
# One named MCP server, `qits`, at /mcp. The name is not optional: quarkus-mcp-server-http refuses to
# start with a tool registered under a server it was not told about. McpTools registers every tool
# under it.
quarkus.mcp.server.qits.http.root-path=/mcp
# One page of tools, always. The library pages `tools/list` past 50 tools and this server holds more;
# a client that reads one page would lose the rest with nothing failing. 0 turns paging off.
quarkus.mcp.server.qits.tools.page-size=0
# The extension always has a default server too, also at /mcp, and refuses to build with two servers
# on one path. It holds nothing here, so it gets no HTTP endpoint at all.
quarkus.mcp.server.http.enabled=false

# --- the read-only mode ---------------------------------------------------------------------------
# A request to /mcp?agentReadOnly=true sees and runs only the tools whose command is marked
# @TuiCommand(effect = Effect.READ); a call to any other is refused and nothing runs. The coding-agents
# library adds the marker for unattended runs. An unmarked command is a write. ReadOnlyToolFilter.

# --- the caller's bearer ------------------------------------------------------------------------
# Every call runs as whoever made it, so nobody reaches /mcp without a bearer: 401 before any tool
# runs. Bearer only (no login flow, no session), and only a token addressed to the platform.
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=authenticated
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=qits-platform

# The idp is dialled on its wire alias; the deployment names it (QUARKUS_OIDC_AUTH_SERVER_URL, from the
# bootstrap template), and this default spells the same rule for a deployment that does not.
quarkus.oidc.auth-server-url=http://${QITS_ENV:dev}-qits-idp:8080/idp
# Discovery ON (the default; ticket qits-708, the qits-1149 pattern). The tenant reads
# <auth-server-url>/.well-known/openid-configuration and takes two things from it: where the keys are
# (its jwks_uri; qits-idp names its internal addresses to an in-network caller, so the keys are still
# fetched on qits-net) and the ISSUER every bearer's `iss` is checked against, which the idp publishes
# as https://idp.qits.<domain>. A token signed by a published key and addressed to qits-platform but
# carrying any other `iss` is a 401. Before qits-708 discovery was off and no issuer was set, and
# quarkus-oidc then checks no `iss` at all. There is deliberately NO quarkus.oidc.token.issuer line and
# no issuer key of any kind (owner decision, qits-730): the issuer is never configuration, discovery
# is the pin. pacts/qits-platform-access-monorepo_qits-idp-service.json binds both reads, the issuer by
# value (IdpContract's StartupEvent rows), and ClientCallsGuardTest holds those rows to this file.
#
# One read at boot, and no connection-delay on purpose: an idp that does not answer then is a WARN and
# the tenant tries again on the first request that carries a bearer, so the service is ready whether
# the idp is up or not (readiness never waits on another service). The keys are fetched when a token
# first needs one, never at boot (resolve-early=false), and fetched again at most every five seconds
# when a token names a key the cached set does not hold, so a key the idp rotates in is usable at once.
quarkus.oidc.jwks.resolve-early=false
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S
# A test or a dev run never starts a stand-in idp for this service: the tests bring their own key.
quarkus.oidc.devservices.enabled=false
quarkus.keycloak.devservices.enabled=false

# --- the commands' environment ------------------------------------------------------------------
# What a command sees as its environment is built by ToolRunner.environment, from these names in this
# service's own configuration, and nothing else: QITS_PLATFORM=true, QITS_ENV (the environment the
# wire aliases are in) and the five QITS_<APP>_URL overrides when set (QITS_OBSERVABILITY_URL comes
# from the deployment). Deliberately not the whole process environment. One call adds QITS_AGENT_ID
# when the caller's token carries an `agent` claim, so `qits wait` finds the calling agent.

# --- the packaged artifact ----------------------------------------------------------------------
# `target/qits-platform-access-mcp-service`, the application's own name, rather than the module's
# with -runner after it: the image copies this path and `ps` shows what the edge routes to.
quarkus.package.output-name=qits-platform-access-mcp-service
quarkus.package.jar.add-runner-suffix=false

# Recorded so the build time fixed value agrees with a workspace container's environment, which sets
# QUARKUS_ANALYTICS_DISABLED=true; the same reason as the CLI's.
quarkus.analytics.disabled=true
