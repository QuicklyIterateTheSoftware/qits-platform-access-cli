# --- the server ---------------------------------------------------------------------------------
# One named MCP server, `qits`, at /mcp. The name is not optional: quarkus-mcp-server-http refuses to
# start with a tool registered under a server it was not told about. McpTools registers every tool
# under it.
quarkus.mcp.server.qits.http.root-path=/mcp
# One page of tools, always. The library pages `tools/list` past 50 tools and this server holds more;
# a client that reads one page would lose the rest with nothing failing. 0 turns paging off.
quarkus.mcp.server.qits.tools.page-size=0
# The extension always has a default server too, also at /mcp, and refuses to build with two servers
# on one path. It holds nothing here, so it gets no HTTP endpoint at all.
quarkus.mcp.server.http.enabled=false

# --- the caller's bearer ------------------------------------------------------------------------
# Every call runs as whoever made it, so nobody reaches /mcp without a bearer: 401 before any tool
# runs. Bearer only (no login flow, no session), and only a token addressed to the platform.
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=authenticated
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=qits-platform

# The idp is dialled on its wire alias; the deployment names it (QUARKUS_OIDC_AUTH_SERVER_URL, from the
# bootstrap template), and this default spells the same rule for a deployment that does not. Keys
# are fetched when a token first needs one, never at boot, so the service is ready whether the idp is
# up or not: readiness never waits on another service.
quarkus.oidc.auth-server-url=http://${QITS_ENV:dev}-qits-idp:8080/idp
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks
quarkus.oidc.jwks.resolve-early=false
# A test or a dev run never starts a stand-in idp for this service: the tests bring their own key.
quarkus.oidc.devservices.enabled=false
quarkus.keycloak.devservices.enabled=false

# --- the commands' environment ------------------------------------------------------------------
# What a command sees as its environment is built by ToolRunner.environment, from these names in this
# service's own configuration, and nothing else: QITS_PLATFORM=true, QITS_ENV (the environment the
# wire aliases are in) and the four QITS_<APP>_URL overrides when set (QITS_OBSERVABILITY_URL comes
# from the deployment). Deliberately not the whole process environment.

# --- the packaged artifact ----------------------------------------------------------------------
# `target/qits-platform-access-mcp-service`, the application's own name, rather than the module's
# with -runner after it: the image copies this path and `ps` shows what the edge routes to.
quarkus.package.output-name=qits-platform-access-mcp-service
quarkus.package.jar.add-runner-suffix=false

# Recorded so the build time fixed value agrees with a workspace container's environment, which sets
# QUARKUS_ANALYTICS_DISABLED=true; the same reason as the CLI's.
quarkus.analytics.disabled=true
