# Filtered at build time - see the <resources> block of platform-access-commands/pom.xml. The value
# is the reactor's project version, which the release stamps with the version it tags and publishes
# the binary under, so `qits -V` names the daemons-store version this binary was published as.
# (Filtering rewrites these comment lines too, which is why this one does not spell the property.)
#
# Do NOT write a literal here. QitsVersion treats a value that still starts with `$` as unknown, and
# a build that does not know its version never updates itself.
version=${project.version}
